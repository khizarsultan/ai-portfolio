[project]
name = "prior-auth-agent"
version = "0.1.0"
description = "Multi-agent prior-authorization system (LangGraph + Claude) on synthetic data"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-nvidia-ai-endpoints",
    "langchain-ollama",
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "langfuse",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src", "src.agents", "src.payer", "src.data_prep",
            "src.llm", "src.compliance", "src.governance"]
